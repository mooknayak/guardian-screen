<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guardian Screen — Fire TV</title>
<style>
  body { margin:0; background:#0d1015; color:#e7e9ee; font-family: sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:24px 32px; font-size:22px; font-weight:600; }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; position:relative; }
  .idle { color:#5c6577; font-size:20px; }
  .alert-banner { position:absolute; top:24px; right:24px; background:#e0654f; color:#fff; padding:14px 20px; border-radius:10px; max-width:360px; display:none; font-size:16px; }
  .pip { position:absolute; bottom:24px; right:24px; width:280px; height:160px; background:#1f2430; border:2px solid #e8a33d; border-radius:8px; display:none; align-items:center; justify-content:center; color:#e8a33d; }
  .demo-row { padding:20px 32px; display:flex; gap:12px; }
  button { background:#1f2430; color:#e7e9ee; border:1px solid #2a3040; padding:10px 16px; border-radius:8px; font-size:14px; }
</style>
</head>
<body>
<header>Guardian Screen</header>
<div class="stage">
  <div class="idle" id="idle">कोई नया अलर्ट नहीं — सब कुछ सामान्य है</div>
  <div class="alert-banner" id="banner"></div>
  <div class="pip" id="pip">📹 Camera Feed</div>
</div>
<div class="demo-row">
  <button onclick="simulate('ring')">डेमो: Ring इवेंट भेजो</button>
  <button onclick="simulate('bee')">डेमो: Bee SOS भेजो</button>
</div>

<script>
// इसे अपने असली API Gateway WebSocket endpoint से बदलें
const WEBSOCKET_URL = "wss://REPLACE_WITH_YOUR_WEBSOCKET_URL?user_id=user_123";
// इसे अपने असली REST API endpoint से बदलें (demo trigger के लिए)
const API_URL = "https://REPLACE_WITH_YOUR_API_URL";

let socket;
function connect() {
  socket = new WebSocket(WEBSOCKET_URL);
  socket.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    handleMessage(msg);
  };
  socket.onclose = () => setTimeout(connect, 3000);
}

function handleMessage(msg) {
  document.getElementById("idle").style.display = "none";
  if (msg.action === "show_camera") {
    document.getElementById("pip").style.display = "flex";
  }
  if (msg.severity === "medium" || msg.severity === "emergency") {
    const b = document.getElementById("banner");
    b.textContent = msg.caption || "नया अलर्ट";
    b.style.display = "block";
  }
}

async function simulate(source) {
  const payload = source === "ring"
    ? { user_id: "user_123", source: "ring", payload: { visitor_type: "unknown_person" } }
    : { user_id: "user_123", source: "bee", payload: { type: "sos" } };
  try {
    await fetch(API_URL + "/ring-event", {
      method: "POST",
      body: JSON.stringify(payload),
    });
  } catch (e) { console.error(e); }
}

connect();
</script>
</body>
</html>
