<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guardian Screen — Admin</title>
<style>
  body { margin:0; background:#12151b; color:#e7e9ee; font-family: sans-serif; padding:24px; }
  h1 { font-size:20px; }
  input { background:#1f2430; border:1px solid #2a3040; color:#e7e9ee; padding:8px; border-radius:6px; margin:4px; }
  button { background:#e8a33d; color:#1a1408; border:none; padding:8px 14px; border-radius:6px; font-weight:600; }
  table { width:100%; border-collapse:collapse; margin-top:20px; }
  td, th { border-bottom:1px solid #2a3040; padding:8px; text-align:left; font-size:14px; }
</style>
</head>
<body>
<h1>Guardian Manager</h1>
<div>
  <input id="name" placeholder="नाम">
  <input id="phone" placeholder="फ़ोन">
  <input id="priority" placeholder="प्राथमिकता (1,2,3)" type="number">
  <button onclick="addGuardian()">जोड़ें</button>
</div>
<table id="guardianTable"><thead><tr><th>नाम</th><th>फ़ोन</th><th>प्राथमिकता</th><th></th></tr></thead><tbody></tbody></table>

<h1>Event Logs</h1>
<table id="logsTable"><thead><tr><th>समय</th><th>सोर्स</th><th>सेवियरिटी</th><th>विवरण</th></tr></thead><tbody></tbody></table>

<script>
const API_URL = "https://REPLACE_WITH_YOUR_API_URL";
const USER_ID = "user_123";

async function loadGuardians() {
  const res = await fetch(`${API_URL}/guardians?user_id=${USER_ID}`);
  const items = await res.json();
  const body = document.querySelector("#guardianTable tbody");
  body.innerHTML = "";
  items.forEach(g => {
    body.innerHTML += `<tr><td>${g.name}</td><td>${g.phone}</td><td>${g.priority}</td>
      <td><button onclick="removeGuardian('${g.guardian_id}')">हटाएँ</button></td></tr>`;
  });
}

async function addGuardian() {
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const priority = Number(document.getElementById("priority").value || 1);
  await fetch(`${API_URL}/guardians?user_id=${USER_ID}`, {
    method: "POST",
    body: JSON.stringify({ name, phone, priority }),
  });
  loadGuardians();
}

async function removeGuardian(id) {
  await fetch(`${API_URL}/guardians/${id}?user_id=${USER_ID}`, { method: "DELETE" });
  loadGuardians();
}

async function loadLogs() {
  const res = await fetch(`${API_URL}/logs?user_id=${USER_ID}`);
  const items = await res.json();
  const body = document.querySelector("#logsTable tbody");
  body.innerHTML = "";
  items.forEach(i => {
    const time = new Date(i.timestamp * 1000).toLocaleString();
    body.innerHTML += `<tr><td>${time}</td><td>${i.source}</td><td>${i.severity}</td><td>${i.description}</td></tr>`;
  });
}

loadGuardians();
loadLogs();
</script>
</body>
</html>
