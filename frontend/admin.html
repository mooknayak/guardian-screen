<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guardian Screen — Admin</title>
<style>
  body { margin:0; background:#12151b; color:#e7e9ee; font-family: sans-serif; padding:24px; }
  h1 { font-size:20px; }
  input { background:#1f2430; border:1px solid #2a3040; color:#e7e9ee; padding:8px; border-radius:6px; margin:4px; }
  button { background:#e8a33d; color:#1a1408; border:none; padding:8px 14px; border-radius:6px; font-weight:600; }
  table { width:100%; border-collapse:collapse; margin-top:20px; }
  td, th { border-bottom:1px solid #2a3040; padding:8px; text-align:left; font-size:14px; }
</style>
</head>
<body>
<h1>Guardian Manager</h1>
<div>
  <input id="name" placeholder="नाम">
  <input id="phone" placeholder="फ़ोन">
  <input id="email" placeholder="ईमेल (अलर्ट के लिए)" type="email">
  <select id="pref"><option value="all">सभी अलर्ट</option><option value="emergency_only">सिर्फ़ इमरजेंसी</option></select>
  <input id="priority" placeholder="प्राथमिकता (1,2,3)" type="number">
  <button onclick="addGuardian()">जोड़ें</button>
</div>
<table id="guardianTable"><thead><tr><th>नाम</th><th>फ़ोन</th><th>प्राथमिकता</th><th></th></tr></thead><tbody></tbody></table>

<h1>Event Logs</h1>
<table id="logsTable"><thead><tr><th>समय</th><th>सोर्स</th><th>सेवियरिटी</th><th>विवरण</th></tr></thead><tbody></tbody></table>

<script>
// ✅ असली endpoint डाल दिया गया है
const API_URL = "https://ymdeoe886j.execute-api.ap-south-1.amazonaws.com";
const USER_ID = "user_123";

// सुरक्षा: यूज़र का टेक्स्ट सीधे HTML में न जाए (XSS से बचाव)
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

async function loadGuardians() {
  try {
    const res = await fetch(`${API_URL}/guardians?user_id=${USER_ID}`);
    const items = await res.json();
    const body = document.querySelector("#guardianTable tbody");
    body.innerHTML = "";
    items.forEach(g => {
      body.innerHTML += `<tr><td>${esc(g.name)}</td><td>${esc(g.phone)}</td><td>${esc(g.priority)}</td>
        <td><button onclick="removeGuardian('${esc(g.guardian_id)}')">हटाएँ</button></td></tr>`;
    });
  } catch (e) { console.error(e); }
}

async function addGuardian() {
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const notify_pref = document.getElementById("pref").value;
  const priority = Number(document.getElementById("priority").value || 1);
  if (!name) { alert("नाम ज़रूरी है"); return; }
  await fetch(`${API_URL}/guardians?user_id=${USER_ID}`, {
    method: "POST",
    body: JSON.stringify({ name, phone, email, notify_pref, priority }),
  });
  document.getElementById("name").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("email").value = "";
  loadGuardians();
}

async function removeGuardian(id) {
  await fetch(`${API_URL}/guardians/${id}?user_id=${USER_ID}`, { method: "DELETE" });
  loadGuardians();
}

async function loadLogs() {
  try {
    const res = await fetch(`${API_URL}/logs?user_id=${USER_ID}`);
    const items = await res.json();
    const body = document.querySelector("#logsTable tbody");
    body.innerHTML = "";
    items.forEach(i => {
      const time = new Date(i.timestamp * 1000).toLocaleString();
      body.innerHTML += `<tr><td>${esc(time)}</td><td>${esc(i.source)}</td><td>${esc(i.severity)}</td><td>${esc(i.description)}</td></tr>`;
    });
  } catch (e) { console.error(e); }
}

loadGuardians();
loadLogs();
setInterval(loadLogs, 5000); // लाइव लॉग: हर 5 सेकंड में अपने-आप ताज़ा
</script>
</body>
</html>
